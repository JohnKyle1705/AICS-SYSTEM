<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 2380" width="1000" height="2380" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.12" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#b45309" />
    </marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1e3a8a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#b91c1c" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#047857" />
    </marker>

    <!-- Gradients -->
    <!-- Terminator (Oval) Gradient -->
    <linearGradient id="grad-terminator" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Parallelogram (IO) Gradient -->
    <linearGradient id="grad-io" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Diamond (Decision) Gradient -->
    <linearGradient id="grad-decision" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Process (Rectangle) Gradient -->
    <linearGradient id="grad-process" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <!-- Decline / Error Gradient -->
    <linearGradient id="grad-decline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fee2e2" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <!-- ================= HEADER SECTION ================= -->
  <rect x="0" y="0" width="1000" height="110" fill="#f8fafc" />
  <line x1="0" y1="110" x2="1000" y2="110" stroke="#e2e8f0" stroke-width="2" />
  <text x="500" y="50" text-anchor="middle" font-size="28" font-weight="800" fill="#0f172a" letter-spacing="0.5">
    Flowchart of Administrator Process
  </text>
  <text x="500" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#b45309">
    AICS REQUEST MANAGEMENT &amp; BENEFICIARY INFORMATION SYSTEM — DAANBANTAYAN, CEBU
  </text>

  <!-- ================= 1. START (OVAL) ================= -->
  <g filter="url(#shadow)">
    <ellipse cx="500" cy="170" rx="95" ry="34" fill="url(#grad-terminator)" stroke="#c2410c" stroke-width="2.5" />
    <text x="500" y="177" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="1">START</text>
  </g>

  <!-- Line: Start -> Input Credentials -->
  <line x1="500" y1="205" x2="500" y2="255" stroke="#b45309" stroke-width="3" marker-end="url(#arrow)" />

  <!-- ================= 2. INPUT CREDENTIALS (PARALLELOGRAM) ================= -->
  <g filter="url(#shadow)">
    <polygon points="380,260 660,260 620,330 340,330" fill="url(#grad-io)" stroke="#c2410c" stroke-width="2.5" />
    <text x="500" y="290" text-anchor="middle" font-size="15" font-weight="700" fill="#431407">Input Admin Credentials</text>
    <text x="500" y="310" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12">&amp; Agree to Terms &amp; Conditions</text>
  </g>

  <!-- Line: Input Credentials -> Decision Role -->
  <line x1="500" y1="330" x2="500" y2="385" stroke="#b45309" stroke-width="3" marker-end="url(#arrow)" />

  <!-- ================= 3. DECISION: IS ADMIN? (DIAMOND) ================= -->
  <g filter="url(#shadow)">
    <polygon points="500,390 640,460 500,530 360,460" fill="url(#grad-decision)" stroke="#c2410c" stroke-width="2.5" />
    <text x="500" y="452" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Is Account Active</text>
    <text x="500" y="474" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">&amp; Role == Admin?</text>
  </g>

  <!-- Branch NO: Is Admin? -> Access Denied (Right) -->
  <line x1="640" y1="460" x2="800" y2="460" stroke="#b91c1c" stroke-width="3" marker-end="url(#arrow-red)" />
  <rect x="685" y="440" width="45" height="22" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" />
  <text x="707" y="456" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">No</text>

  <!-- Access Denied Parallelogram -->
  <g filter="url(#shadow)">
    <polygon points="760,490 950,490 920,550 730,550" fill="url(#grad-decline)" stroke="#b91c1c" stroke-width="2" />
    <text x="840" y="518" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Display Access Denied</text>
    <text x="840" y="535" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">/ Redirect to /pending</text>
  </g>

  <!-- Line: Access Denied -> Stop -->
  <line x1="840" y1="550" x2="840" y2="590" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrow-red)" />
  <g filter="url(#shadow)">
    <ellipse cx="840" cy="620" rx="70" ry="26" fill="url(#grad-decline)" stroke="#b91c1c" stroke-width="2" />
    <text x="840" y="626" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">STOP</text>
  </g>

  <!-- Branch YES: Is Admin? -> Display Dashboard (Down) -->
  <line x1="500" y1="530" x2="500" y2="585" stroke="#047857" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="510" y="542" width="45" height="22" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" />
  <text x="532" y="558" text-anchor="middle" font-size="12" font-weight="800" fill="#047857">Yes</text>

  <!-- ================= 4. DISPLAY DASHBOARD (PARALLELOGRAM) ================= -->
  <g filter="url(#shadow)">
    <polygon points="370,590 670,590 630,660 330,660" fill="url(#grad-io)" stroke="#c2410c" stroke-width="2.5" />
    <text x="500" y="620" text-anchor="middle" font-size="15" font-weight="700" fill="#431407">Display Admin Dashboard</text>
    <text x="500" y="640" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12">&amp; Real-time Notification Feeds</text>
  </g>

  <!-- Line: Dashboard -> Receive Request -->
  <line x1="500" y1="660" x2="500" y2="715" stroke="#b45309" stroke-width="3" marker-end="url(#arrow)" />

  <!-- ================= 5. RECEIVE AICS REQUEST (PARALLELOGRAM) ================= -->
  <g filter="url(#shadow)">
    <polygon points="360,720 680,720 640,790 320,790" fill="url(#grad-io)" stroke="#c2410c" stroke-width="2.5" />
    <text x="500" y="750" text-anchor="middle" font-size="15" font-weight="700" fill="#431407">Receive New AICS Request</text>
    <text x="500" y="770" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12">(Medical or Burial Assistance)</text>
  </g>

  <!-- Line: Receive Request -> Verify Beneficiary -->
  <line x1="500" y1="790" x2="500" y2="845" stroke="#b45309" stroke-width="3" marker-end="url(#arrow)" />

  <!-- ================= 6. VERIFY BENEFICIARY (RECTANGLE) ================= -->
  <g filter="url(#shadow)">
    <rect x="330" y="850" width="340" height="75" rx="8" fill="url(#grad-process)" stroke="#c2410c" stroke-width="2.5" />
    <text x="500" y="880" text-anchor="middle" font-size="15" font-weight="700" fill="#431407">Verify Beneficiary Profile</text>
    <text x="500" y="902" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12">Barangay Pajo Residency, Purok &amp; Household</text>
  </g>

  <!-- Line: Verify Beneficiary -> Documents Decision -->
  <line x1="500" y1="925" x2="500" y2="980" stroke="#b45309" stroke-width="3" marker-end="url(#arrow)" />

  <!-- ================= 7. DECISION: DOCUMENTS COMPLETE? (DIAMOND) ================= -->
  <g filter="url(#shadow)">
    <polygon points="500,985 645,1060 500,1135 355,1060" fill="url(#grad-decision)" stroke="#c2410c" stroke-width="2.5" />
    <text x="500" y="1052" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Are Uploaded</text>
    <text x="500" y="1074" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Documents Complete?</text>
  </g>

  <!-- Branch NO: Documents -> Notify Re-upload (Left) -->
  <line x1="355" y1="1060" x2="240" y2="1060" stroke="#b91c1c" stroke-width="3" marker-end="url(#arrow-red)" />
  <rect x="270" y="1040" width="45" height="22" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" />
  <text x="292" y="1056" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">No</text>

  <!-- Flag Missing Requirements Box -->
  <g filter="url(#shadow)">
    <rect x="30" y="1025" width="210" height="70" rx="8" fill="url(#grad-decline)" stroke="#b91c1c" stroke-width="2" />
    <text x="135" y="1053" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Flag Missing Documents</text>
    <text x="135" y="1073" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">&amp; Notify Resident to Resubmit</text>
  </g>

  <!-- Loop back arrow from Missing docs back to Receive Request -->
  <path d="M 135 1025 L 135 755 L 310 755" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-red)" />
  <text x="145" y="880" font-size="11" font-weight="700" fill="#b91c1c">Wait for Resident Upload</text>

  <!-- Branch YES: Documents -> Social Worker Assessment (Down) -->
  <line x1="500" y1="1135" x2="500" y2="1195" stroke="#047857" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="510" y="1150" width="45" height="22" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" />
  <text x="532" y="1166" text-anchor="middle" font-size="12" font-weight="800" fill="#047857">Yes</text>

  <!-- ================= 8. CONDUCT SOCIAL CASE ASSESSMENT (RECTANGLE) ================= -->
  <g filter="url(#shadow)">
    <rect x="320" y="1200" width="360" height="80" rx="8" fill="url(#grad-process)" stroke="#c2410c" stroke-width="2.5" />
    <text x="500" y="1230" text-anchor="middle" font-size="15" font-weight="700" fill="#431407">Conduct Social Case Assessment</text>
    <text x="500" y="1252" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12">Record Interview Findings, Crisis Evaluation</text>
    <text x="500" y="1270" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12">&amp; Determine Recommended Grant Amount</text>
  </g>

  <!-- Line: Assessment -> Fund Availability Check -->
  <line x1="500" y1="1280" x2="500" y2="1335" stroke="#b45309" stroke-width="3" marker-end="url(#arrow)" />

  <!-- ================= 9. DECISION: FUND AVAILABLE? (DIAMOND) ================= -->
  <g filter="url(#shadow)">
    <polygon points="500,1340 645,1415 500,1490 355,1415" fill="url(#grad-decision)" stroke="#c2410c" stroke-width="2.5" />
    <text x="500" y="1407" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Is Municipal Fund</text>
    <text x="500" y="1429" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Balance Sufficient?</text>
  </g>

  <!-- Branch NO: Fund -> Allocate Funds (Right) -->
  <line x1="645" y1="1415" x2="770" y2="1415" stroke="#b91c1c" stroke-width="3" marker-end="url(#arrow-red)" />
  <rect x="685" y="1395" width="45" height="22" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" />
  <text x="707" y="1411" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">No</text>

  <!-- Low Balance Alert Box -->
  <g filter="url(#shadow)">
    <rect x="770" y="1380" width="200" height="70" rx="8" fill="url(#grad-decline)" stroke="#b91c1c" stroke-width="2" />
    <text x="870" y="1408" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Low Balance Warning</text>
    <text x="870" y="1428" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Admin Allocates New Budget</text>
  </g>

  <!-- Loop back arrow from Fund Allocation -->
  <path d="M 870 1380 L 870 1320 L 580 1320" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-red)" />
  <text x="880" y="1350" font-size="11" font-weight="700" fill="#b91c1c">Budget Deposited</text>

  <!-- Branch YES: Fund -> Final Approval Decision (Down) -->
  <line x1="500" y1="1490" x2="500" y2="1550" stroke="#047857" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="510" y="1505" width="45" height="22" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" />
  <text x="532" y="1521" text-anchor="middle" font-size="12" font-weight="800" fill="#047857">Yes</text>

  <!-- ================= 10. DECISION: ADMIN APPROVE? (DIAMOND) ================= -->
  <g filter="url(#shadow)">
    <polygon points="500,1555 655,1635 500,1715 345,1635" fill="url(#grad-decision)" stroke="#c2410c" stroke-width="2.5" />
    <text x="500" y="1625" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Admin Evaluation Decision:</text>
    <text x="500" y="1648" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">Approve or Decline?</text>
  </g>

  <!-- Branch DECLINE: Admin -> Record Rejection Remarks (Left) -->
  <line x1="345" y1="1635" x2="220" y2="1635" stroke="#b91c1c" stroke-width="3" marker-end="url(#arrow-red)" />
  <rect x="250" y="1615" width="60" height="22" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" />
  <text x="280" y="1631" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">Decline</text>

  <!-- Decline Process Box -->
  <g filter="url(#shadow)">
    <rect x="20" y="1605" width="200" height="65" rx="8" fill="url(#grad-decline)" stroke="#b91c1c" stroke-width="2" />
    <text x="120" y="1633" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Record Justification</text>
    <text x="120" y="1651" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">&amp; Set Status = 'Declined'</text>
  </g>

  <!-- Line: Decline Process -> Decline Notice IO -->
  <line x1="120" y1="1670" x2="120" y2="1720" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrow-red)" />
  <g filter="url(#shadow)">
    <polygon points="30,1725 210,1725 190,1785 10,1785" fill="url(#grad-io)" stroke="#c2410c" stroke-width="2" />
    <text x="110" y="1750" text-anchor="middle" font-size="12" font-weight="700" fill="#431407">Send Rejection Notice</text>
    <text x="110" y="1768" text-anchor="middle" font-size="11" font-weight="600" fill="#7c2d12">to Resident with Remarks</text>
  </g>

  <!-- Line: Decline Notice -> Stop -->
  <line x1="110" y1="1785" x2="110" y2="1835" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrow-red)" />
  <g filter="url(#shadow)">
    <ellipse cx="110" cy="1865" rx="65" ry="25" fill="url(#grad-decline)" stroke="#b91c1c" stroke-width="2" />
    <text x="110" y="1871" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">STOP</text>
  </g>

  <!-- Branch APPROVE: Admin -> Set Approved Amount (Down) -->
  <line x1="500" y1="1715" x2="500" y2="1775" stroke="#047857" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="510" y="1730" width="60" height="22" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" />
  <text x="540" y="1746" text-anchor="middle" font-size="12" font-weight="800" fill="#047857">Approve</text>

  <!-- ================= 11. AUTHORIZE AMOUNT & APPROVE (RECTANGLE) ================= -->
  <g filter="url(#shadow)">
    <rect x="320" y="1780" width="360" height="75" rx="8" fill="url(#grad-process)" stroke="#c2410c" stroke-width="2.5" />
    <text x="500" y="1810" text-anchor="middle" font-size="15" font-weight="700" fill="#431407">Set Approved Assistance Amount</text>
    <text x="500" y="1832" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12">&amp; Update Status = 'Approved' in Database</text>
  </g>

  <!-- Line: Approve -> Route to Treasury & Audit Log -->
  <line x1="500" y1="1855" x2="500" y2="1910" stroke="#b45309" stroke-width="3" marker-end="url(#arrow)" />

  <!-- ================= 12. ROUTE TO TREASURY & AUDIT (RECTANGLE) ================= -->
  <g filter="url(#shadow)">
    <rect x="310" y="1915" width="380" height="80" rx="8" fill="url(#grad-process)" stroke="#c2410c" stroke-width="2.5" />
    <text x="500" y="1945" text-anchor="middle" font-size="15" font-weight="700" fill="#431407">Route Request to Municipal Treasurer</text>
    <text x="500" y="1967" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12">Queue for Cash Voucher Preparation &amp; Disbursement</text>
    <text x="500" y="1984" text-anchor="middle" font-size="12" font-weight="600" fill="#7c2d12">&amp; Insert APPROVE_REQUEST in system_logs</text>
  </g>

  <!-- Line: Route -> Send Notifications -->
  <line x1="500" y1="1995" x2="500" y2="2050" stroke="#b45309" stroke-width="3" marker-end="url(#arrow)" />

  <!-- ================= 13. SEND NOTIFICATIONS (PARALLELOGRAM) ================= -->
  <g filter="url(#shadow)">
    <polygon points="360,2055 680,2055 640,2130 320,2130" fill="url(#grad-io)" stroke="#c2410c" stroke-width="2.5" />
    <text x="500" y="2087" text-anchor="middle" font-size="15" font-weight="700" fill="#431407">Send Real-time Notifications</text>
    <text x="500" y="2108" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12">to Resident (Approved) &amp; Treasurers (Ready for Payout)</text>
  </g>

  <!-- Line: Send Notifications -> Stop -->
  <line x1="500" y1="2130" x2="500" y2="2195" stroke="#b45309" stroke-width="3" marker-end="url(#arrow)" />

  <!-- ================= 14. STOP (OVAL) ================= -->
  <g filter="url(#shadow)">
    <ellipse cx="500" cy="2235" rx="95" ry="34" fill="url(#grad-terminator)" stroke="#c2410c" stroke-width="2.5" />
    <text x="500" y="2242" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="1">STOP</text>
  </g>

  <!-- ================= FOOTER / LEGEND ================= -->
  <g transform="translate(100, 2300)">
    <rect x="0" y="0" width="800" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    <!-- Oval Legend -->
    <ellipse cx="40" cy="25" rx="20" ry="10" fill="url(#grad-terminator)" stroke="#c2410c" stroke-width="1" />
    <text x="70" y="29" font-size="12" font-weight="700" fill="#475569">Start / Stop</text>
    <!-- Parallelogram Legend -->
    <polygon points="170,16 230,16 215,34 155,34" fill="url(#grad-io)" stroke="#c2410c" stroke-width="1" />
    <text x="240" y="29" font-size="12" font-weight="700" fill="#475569">Input / Output</text>
    <!-- Rectangle Legend -->
    <rect x="360" y="16" width="50" height="18" rx="3" fill="url(#grad-process)" stroke="#c2410c" stroke-width="1" />
    <text x="420" y="29" font-size="12" font-weight="700" fill="#475569">Process Task</text>
    <!-- Diamond Legend -->
    <polygon points="540,16 560,25 540,34 520,25" fill="url(#grad-decision)" stroke="#c2410c" stroke-width="1" />
    <text x="570" y="29" font-size="12" font-weight="700" fill="#475569">Decision Branch</text>
    <!-- Flow Arrow -->
    <line x1="700" y1="25" x2="735" y2="25" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)" />
    <text x="745" y="29" font-size="12" font-weight="700" fill="#475569">Flow Direction</text>
  </g>
</svg>
