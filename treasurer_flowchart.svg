    <text x="680" y="605" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Step a</text>
  </g>

  <!-- DECISION d (Olive Diamond) -->
  <g id="node-decision-d" filter="url(#shadow)">
    <polygon points="830,600 900,655 830,710 760,655" fill="#8cb811" stroke="#688c0a" stroke-width="2" />
    <text x="830" y="651" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Decision</text>
    <text x="830" y="668" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">d</text>
  </g>

  <!-- STEP c (Purple Box) -->
  <g id="node-step-c" filter="url(#shadow-sm)">
    <rect x="625" y="790" width="110" height="60" rx="6" fill="#7e57c2" stroke="#5a3899" stroke-width="2" />
    <text x="680" y="825" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Step c</text>
  </g>

  <!-- STEP d (Purple Box) -->
  <g id="node-step-d" filter="url(#shadow-sm)">
    <rect x="775" y="790" width="110" height="60" rx="6" fill="#7e57c2" stroke="#5a3899" stroke-width="2" />
    <text x="830" y="825" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Step d</text>
  </g>

  <!-- DECISION c (Olive Diamond) -->
  <g id="node-decision-c" filter="url(#shadow)">
