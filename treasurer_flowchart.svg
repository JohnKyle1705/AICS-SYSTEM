    <polygon points="390,600 460,655 390,710 320,655" fill="#1b7f4b" stroke="#135b34" stroke-width="2" />
    <text x="390" y="651" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Decision</text>
    <text x="390" y="668" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>
  </g>

  <!-- STEP 4 (Orange Box) -->
