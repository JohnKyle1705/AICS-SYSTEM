<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 920" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    <filter id="shadow-sm" x="-5%" y="-5%" width="115%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.08" />
    </filter>

    <!-- Arrowhead Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2b2d42" />
    </marker>
  </defs>

  <!-- Title Header -->
  <g id="header">
    <text x="590" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b" letter-spacing="0.5">MUNICIPAL TREASURER OPERATIONAL FLOW CHART</text>
    <text x="590" y="50" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b">AICS Request Management &amp; Disbursement System — Municipality of Daanbantayan</text>
  </g>

  <!-- ==================== CONNECTORS & LABELS ==================== -->
  <g id="connectors" stroke="#2b2d42" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Start -> Decision 1 & Decision a -->
    <path d="M 540 120 L 540 145 L 250 145 L 250 180" marker-end="url(#arrow)" />
    <path d="M 540 120 L 540 145 L 830 145 L 830 180" marker-end="url(#arrow)" />

    <!-- Decision 1 -> Step 1 (YES) & Decision 2 (NO) -->
    <path d="M 250 290 L 250 330 L 105 330 L 105 385" marker-end="url(#arrow)" />
    <path d="M 250 290 L 250 330 L 390 330 L 390 385" marker-end="url(#arrow)" />

    <!-- Decision 2 -> Decision 3 (YES) & Decision 4 (NO) -->
    <path d="M 390 500 L 390 545 L 250 545 L 250 600" marker-end="url(#arrow)" />
    <path d="M 390 500 L 390 600" marker-end="url(#arrow)" />

    <!-- Decision 3 -> Step 4 (YES) & Step 3 (NO) -->
    <path d="M 180 655 L 105 655 L 105 785" marker-end="url(#arrow)" />
    <path d="M 250 710 L 250 785" marker-end="url(#arrow)" />

    <!-- Decision 4 -> Step 2 (YES) -->
    <path d="M 390 710 L 390 785" marker-end="url(#arrow)" />

    <!-- Decision a -> Decision b (YES) & Decision c (NO) -->
    <path d="M 830 290 L 830 330 L 680 330 L 680 385" marker-end="url(#arrow)" />
    <path d="M 830 290 L 830 330 L 980 330 L 980 385" marker-end="url(#arrow)" />

    <!-- Decision b -> Step a (YES) & Decision d (NO) -->
    <path d="M 680 500 L 680 565" marker-end="url(#arrow)" />
    <path d="M 750 445 L 830 445 L 830 600" marker-end="url(#arrow)" />

    <!-- Step a -> Step c -->
    <path d="M 680 645 L 680 785" marker-end="url(#arrow)" />

    <!-- Decision d -> Step d (YES) -->
    <path d="M 830 710 L 830 785" marker-end="url(#arrow)" />

    <!-- Decision c -> Step b (YES) & Decision e (NO) -->
    <path d="M 980 500 L 980 565" marker-end="url(#arrow)" />
    <path d="M 1050 445 L 1100 445 L 1100 600" marker-end="url(#arrow)" />

    <!-- Step b -> Step e -->
    <path d="M 980 645 L 980 785" marker-end="url(#arrow)" />

    <!-- Decision e -> Step e (YES) & Step f (NO) -->
    <path d="M 1100 710 L 1100 750 L 1045 750 L 1045 825 L 1040 825" marker-end="url(#arrow)" />
    <path d="M 1100 710 L 1100 785" marker-end="url(#arrow)" />
  </g>

  <!-- ==================== YES / NO LABELS ==================== -->
  <g id="branch-labels" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">
    <!-- From Start -->
    <rect x="365" y="134" width="44" height="20" rx="4" fill="#ffffff" />
    <text x="387" y="148">YES</text>
    <rect x="670" y="134" width="40" height="20" rx="4" fill="#ffffff" />
    <text x="690" y="148">NO</text>

    <!-- From Decision 1 -->
    <rect x="150" y="320" width="44" height="20" rx="4" fill="#ffffff" />
    <text x="172" y="334">YES</text>
    <rect x="300" y="320" width="40" height="20" rx="4" fill="#ffffff" />
    <text x="320" y="334">NO</text>

    <!-- From Decision 2 -->
    <rect x="290" y="535" width="44" height="20" rx="4" fill="#ffffff" />
    <text x="312" y="549">YES</text>
    <rect x="395" y="540" width="36" height="20" rx="4" fill="#ffffff" />
    <text x="413" y="554">NO</text>

    <!-- From Decision 3 -->
    <rect x="120" y="645" width="44" height="20" rx="4" fill="#ffffff" />
    <text x="142" y="659">YES</text>
    <rect x="255" y="735" width="36" height="20" rx="4" fill="#ffffff" />
    <text x="273" y="749">NO</text>

    <!-- From Decision 4 -->
    <rect x="395" y="735" width="44" height="20" rx="4" fill="#ffffff" />
    <text x="417" y="749">YES</text>

    <!-- From Decision a -->
    <rect x="730" y="320" width="44" height="20" rx="4" fill="#ffffff" />
    <text x="752" y="334">YES</text>
    <rect x="890" y="320" width="40" height="20" rx="4" fill="#ffffff" />
    <text x="910" y="334">NO</text>

    <!-- From Decision b -->
    <rect x="640" y="525" width="44" height="20" rx="4" fill="#ffffff" />
    <text x="662" y="539">YES</text>
    <rect x="770" y="435" width="40" height="20" rx="4" fill="#ffffff" />
    <text x="790" y="449">NO</text>

    <!-- From Decision d -->
    <rect x="835" y="735" width="44" height="20" rx="4" fill="#ffffff" />
    <text x="857" y="749">YES</text>

    <!-- From Decision c -->
    <rect x="940" y="525" width="44" height="20" rx="4" fill="#ffffff" />
    <text x="962" y="539">YES</text>
    <rect x="1055" y="435" width="40" height="20" rx="4" fill="#ffffff" />
    <text x="1075" y="449">NO</text>

    <!-- From Decision e -->
    <rect x="1045" y="738" width="44" height="20" rx="4" fill="#ffffff" />
    <text x="1067" y="752">YES</text>
    <rect x="1105" y="738" width="40" height="20" rx="4" fill="#ffffff" />
    <text x="1125" y="752">NO</text>
