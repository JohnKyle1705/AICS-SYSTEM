    <rect x="195" y="790" width="110" height="60" rx="6" fill="#e67e22" stroke="#b95f13" stroke-width="2" />
    <text x="250" y="825" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Step 3</text>
  </g>

  <!-- STEP 2 (Orange Box) -->
