    <text x="680" y="441" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Decision</text>
    <text x="680" y="458" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">b</text>
  </g>

