    <rect x="925" y="570" width="110" height="60" rx="6" fill="#7e57c2" stroke="#5a3899" stroke-width="2" />
    <text x="980" y="605" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Step b</text>
  </g>

