    <rect x="335" y="790" width="110" height="60" rx="6" fill="#e67e22" stroke="#b95f13" stroke-width="2" />
    <text x="390" y="825" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Step 2</text>
  </g>


  <!-- ==================== RIGHT BRANCH (LIME & PURPLE) ==================== -->

