    <polygon points="830,180 900,235 830,290 760,235" fill="#8cb811" stroke="#688c0a" stroke-width="2" />
    <text x="830" y="231" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Decision</text>
