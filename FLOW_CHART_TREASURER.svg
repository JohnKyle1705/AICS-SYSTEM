<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 2480" width="1000" height="2480" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.12" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#b45309" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#b91c1c" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#047857" />
    </marker>

    <!-- Gradients -->
    <!-- Terminator (Oval) Gradient -->
    <linearGradient id="grad-terminator" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Parallelogram (IO) Gradient -->
    <linearGradient id="grad-io" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Diamond (Decision) Gradient -->
    <linearGradient id="grad-decision" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Process (Rectangle) Gradient -->
    <linearGradient id="grad-process" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <!-- Decline / Error / Alert Gradient -->
    <linearGradient id="grad-decline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fee2e2" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <!-- ================= HEADER SECTION ================= -->
  <rect x="0" y="0" width="1000" height="110" fill="#f8fafc" />
  <line x1="0" y1="110" x2="1000" y2="110" stroke="#e2e8f0" stroke-width="2" />
  <text x="500" y="50" text-anchor="middle" font-size="28" font-weight="800" fill="#0f172a" letter-spacing="0.5">
    Flowchart of Treasurer Process
  </text>
  <text x="500" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#b45309">
    AICS REQUEST MANAGEMENT &amp; BENEFICIARY INFORMATION SYSTEM — DAANBANTAYAN, CEBU
  </text>

  <!-- ================= 1. START (OVAL) ================= -->
  <g filter="url(#shadow)">
    <ellipse cx="500" cy="170" rx="95" ry="34" fill="url(#grad-terminator)" stroke="#c2410c" stroke-width="2.5" />
    <text x="500" y="177" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="1">START</text>
  </g>

  <!-- Line: Start -> Input Credentials -->
  <line x1="500" y1="205" x2="500" y2="255" stroke="#b45309" stroke-width="3" marker-end="url(#arrow)" />

  <!-- ================= 2. INPUT CREDENTIALS (PARALLELOGRAM) ================= -->
  <g filter="url(#shadow)">
    <polygon points="380,260 660,260 620,330 340,330" fill="url(#grad-io)" stroke="#c2410c" stroke-width="2.5" />
    <text x="500" y="290" text-anchor="middle" font-size="15" font-weight="700" fill="#431407">Input Treasurer Credentials</text>
    <text x="500" y="310" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12">&amp; Agree to Terms &amp; Conditions</text>
  </g>

  <!-- Line: Input Credentials -> Decision Role -->
  <line x1="500" y1="330" x2="500" y2="385" stroke="#b45309" stroke-width="3" marker-end="url(#arrow)" />

  <!-- ================= 3. DECISION: IS TREASURER? (DIAMOND) ================= -->
  <g filter="url(#shadow)">
    <polygon points="500,390 645,460 500,530 355,460" fill="url(#grad-decision)" stroke="#c2410c" stroke-width="2.5" />
    <text x="500" y="452" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Is Account Active</text>
    <text x="500" y="474" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">&amp; Role == Treasurer?</text>
  </g>

  <!-- Branch NO: Is Treasurer? -> Access Denied (Right) -->
  <line x1="645" y1="460" x2="800" y2="460" stroke="#b91c1c" stroke-width="3" marker-end="url(#arrow-red)" />
  <rect x="690" y="440" width="45" height="22" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" />
  <text x="712" y="456" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">No</text>

  <!-- Access Denied Parallelogram -->
  <g filter="url(#shadow)">
    <polygon points="760,490 950,490 920,550 730,550" fill="url(#grad-decline)" stroke="#b91c1c" stroke-width="2" />
    <text x="840" y="518" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Display Access Denied</text>
    <text x="840" y="535" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">/ Redirect to /pending</text>
  </g>

  <!-- Line: Access Denied -> Stop -->
  <line x1="840" y1="550" x2="840" y2="590" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrow-red)" />
  <g filter="url(#shadow)">
    <ellipse cx="840" cy="620" rx="70" ry="26" fill="url(#grad-decline)" stroke="#b91c1c" stroke-width="2" />
    <text x="840" y="626" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">STOP</text>
  </g>

  <!-- Branch YES: Is Treasurer? -> Display Dashboard (Down) -->
  <line x1="500" y1="530" x2="500" y2="585" stroke="#047857" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="510" y="542" width="45" height="22" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" />
  <text x="532" y="558" text-anchor="middle" font-size="12" font-weight="800" fill="#047857">Yes</text>

  <!-- ================= 4. DISPLAY TREASURER DASHBOARD (PARALLELOGRAM) ================= -->
  <g filter="url(#shadow)">
    <polygon points="360,590 680,590 640,660 320,660" fill="url(#grad-io)" stroke="#c2410c" stroke-width="2.5" />
    <text x="500" y="618" text-anchor="middle" font-size="15" font-weight="700" fill="#431407">Display Treasurer Dashboard</text>
    <text x="500" y="638" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12">Budget Balances, Available Funds &amp; Earmarked Reserves</text>
  </g>

  <!-- Line: Dashboard -> Load Approved Requests -->
  <line x1="500" y1="660" x2="500" y2="715" stroke="#b45309" stroke-width="3" marker-end="url(#arrow)" />

  <!-- ================= 5. FETCH APPROVED REQUESTS (PARALLELOGRAM) ================= -->
  <g filter="url(#shadow)">
    <polygon points="360,720 680,720 640,790 320,790" fill="url(#grad-io)" stroke="#c2410c" stroke-width="2.5" />
    <text x="500" y="748" text-anchor="middle" font-size="15" font-weight="700" fill="#431407">Load Approved Releases Queue</text>
    <text x="500" y="768" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12">Requests marked 'Approved' by Admin / Social Worker</text>
  </g>

  <!-- Line: Fetch Requests -> Verify Documentation -->
  <line x1="500" y1="790" x2="500" y2="845" stroke="#b45309" stroke-width="3" marker-end="url(#arrow)" />

  <!-- ================= 6. VERIFY DOCUMENTATION (RECTANGLE) ================= -->
  <g filter="url(#shadow)">
    <rect x="320" y="850" width="360" height="75" rx="8" fill="url(#grad-process)" stroke="#c2410c" stroke-width="2.5" />
    <text x="500" y="880" text-anchor="middle" font-size="15" font-weight="700" fill="#431407">Verify Beneficiary &amp; Grant Details</text>
    <text x="500" y="902" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12">Valid ID, Approved Amount, Assistance Type &amp; Order</text>
  </g>

  <!-- Line: Verify -> Decision: Discrepancy? -->
  <line x1="500" y1="925" x2="500" y2="980" stroke="#b45309" stroke-width="3" marker-end="url(#arrow)" />

  <!-- ================= 7. DECISION: DISCREPANCY? (DIAMOND) ================= -->
  <g filter="url(#shadow)">
    <polygon points="500,985 650,1060 500,1135 350,1060" fill="url(#grad-decision)" stroke="#c2410c" stroke-width="2.5" />
    <text x="500" y="1052" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Are Documents &amp; Approved</text>
    <text x="500" y="1074" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Amount Verified?</text>
  </g>

  <!-- Branch NO / DISCREPANCY: Return to Admin (Left) -->
  <line x1="350" y1="1060" x2="240" y2="1060" stroke="#b91c1c" stroke-width="3" marker-end="url(#arrow-red)" />
  <rect x="250" y="1040" width="80" height="22" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" />
  <text x="290" y="1056" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">Discrepancy</text>

  <!-- Return to Admin Box -->
  <g filter="url(#shadow)">
    <rect x="20" y="1025" width="220" height="70" rx="8" fill="url(#grad-decline)" stroke="#b91c1c" stroke-width="2" />
    <text x="130" y="1053" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Return Request to Admin</text>
    <text x="130" y="1073" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Input Remarks / Correction Notes</text>
  </g>

  <!-- Notification to Admin IO -->
  <line x1="130" y1="1095" x2="130" y2="1145" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrow-red)" />
  <g filter="url(#shadow)">
    <polygon points="30,1150 230,1150 200,1210 0,1210" fill="url(#grad-io)" stroke="#c2410c" stroke-width="2" />
    <text x="115" y="1175" text-anchor="middle" font-size="12" font-weight="700" fill="#431407">Dispatch Notification</text>
    <text x="115" y="1193" text-anchor="middle" font-size="11" font-weight="600" fill="#7c2d12">to Social Worker / Admin</text>
  </g>

  <!-- Branch YES: Verified -> Check Municipal Fund (Down) -->
  <line x1="500" y1="1135" x2="500" y2="1195" stroke="#047857" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="510" y="1150" width="45" height="22" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" />
  <text x="532" y="1166" text-anchor="middle" font-size="12" font-weight="800" fill="#047857">Yes</text>

  <!-- ================= 8. CHECK FUND LIQUIDITY (RECTANGLE) ================= -->
  <g filter="url(#shadow)">
    <rect x="320" y="1200" width="360" height="75" rx="8" fill="url(#grad-process)" stroke="#c2410c" stroke-width="2.5" />
    <text x="500" y="1230" text-anchor="middle" font-size="15" font-weight="700" fill="#431407">Inspect Category Fund Liquidity</text>
    <text x="500" y="1252" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12">Query Medical or Burial Fund Available Balance</text>
  </g>

  <!-- Line: Check Liquidity -> Fund Decision -->
  <line x1="500" y1="1275" x2="500" y2="1335" stroke="#b45309" stroke-width="3" marker-end="url(#arrow)" />

  <!-- ================= 9. DECISION: LIQUIDITY SUFFICIENT? (DIAMOND) ================= -->
  <g filter="url(#shadow)">
    <polygon points="500,1340 655,1415 500,1490 345,1415" fill="url(#grad-decision)" stroke="#c2410c" stroke-width="2.5" />
    <text x="500" y="1407" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Is Fund Current Balance</text>
    <text x="500" y="1429" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">&gt;= Approved Grant Amount?</text>
  </g>

  <!-- Branch NO: Insufficient Balance -> Low Balance Warning (Right) -->
  <line x1="655" y1="1415" x2="770" y2="1415" stroke="#b91c1c" stroke-width="3" marker-end="url(#arrow-red)" />
  <rect x="690" y="1395" width="45" height="22" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" />
  <text x="712" y="1411" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">No</text>

  <!-- Insufficient Funds Box -->
  <g filter="url(#shadow)">
    <rect x="770" y="1380" width="205" height="70" rx="8" fill="url(#grad-decline)" stroke="#b91c1c" stroke-width="2" />
    <text x="872" y="1408" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Insufficient Funds Alert</text>
    <text x="872" y="1428" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Hold Queue &amp; Request LGU Refill</text>
  </g>

  <!-- Loop back from refill -->
  <path d="M 872 1380 L 872 1320 L 590 1320" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-red)" />
  <text x="880" y="1350" font-size="11" font-weight="700" fill="#b91c1c">Budget Deposited</text>

  <!-- Branch YES: Fund Sufficient -> Prepare Voucher (Down) -->
  <line x1="500" y1="1490" x2="500" y2="1550" stroke="#047857" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="510" y="1505" width="45" height="22" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" />
  <text x="532" y="1521" text-anchor="middle" font-size="12" font-weight="800" fill="#047857">Yes</text>

  <!-- ================= 10. PREPARE DISBURSEMENT VOUCHER (RECTANGLE) ================= -->
  <g filter="url(#shadow)">
    <rect x="310" y="1555" width="380" height="80" rx="8" fill="url(#grad-process)" stroke="#c2410c" stroke-width="2.5" />
    <text x="500" y="1585" text-anchor="middle" font-size="15" font-weight="700" fill="#431407">Prepare Disbursement Voucher (DV)</text>
    <text x="500" y="1607" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12">Input DV No., Check No., Payment Method &amp; Officer</text>
    <text x="500" y="1624" text-anchor="middle" font-size="12" font-weight="600" fill="#7c2d12">Set release_status = 'Ready for Release'</text>
  </g>

  <!-- Line: Prepare Voucher -> Beneficiary Claim IO -->
  <line x1="500" y1="1635" x2="500" y2="1690" stroke="#b45309" stroke-width="3" marker-end="url(#arrow)" />

  <!-- ================= 11. BENEFICIARY CLAIM / SIGN PAYROLL (PARALLELOGRAM) ================= -->
  <g filter="url(#shadow)">
    <polygon points="350,1695 690,1695 650,1765 310,1765" fill="url(#grad-io)" stroke="#c2410c" stroke-width="2.5" />
    <text x="500" y="1725" text-anchor="middle" font-size="15" font-weight="700" fill="#431407">Beneficiary Claims Assistance</text>
    <text x="500" y="1745" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12">Signs Official Acknowledgment Receipt / Payroll Sheet</text>
  </g>

  <!-- Line: Claim -> Confirm Disbursement Decision -->
  <line x1="500" y1="1765" x2="500" y2="1820" stroke="#b45309" stroke-width="3" marker-end="url(#arrow)" />

  <!-- ================= 12. DECISION: CONFIRM RELEASE? (DIAMOND) ================= -->
  <g filter="url(#shadow)">
    <polygon points="500,1825 655,1905 500,1985 345,1905" fill="url(#grad-decision)" stroke="#c2410c" stroke-width="2.5" />
    <text x="500" y="1895" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Confirm Disbursement</text>
    <text x="500" y="1918" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">&amp; Execute Release?</text>
  </g>

  <!-- Branch HOLD / CANCEL: Confirm Release (Left) -->
  <line x1="345" y1="1905" x2="230" y2="1905" stroke="#b91c1c" stroke-width="3" marker-end="url(#arrow-red)" />
  <rect x="250" y="1885" width="70" height="22" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" />
  <text x="285" y="1901" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">Hold / Cancel</text>

  <!-- Hold in Ready Queue Box -->
  <g filter="url(#shadow)">
    <rect x="20" y="1875" width="210" height="65" rx="8" fill="url(#grad-decline)" stroke="#b91c1c" stroke-width="2" />
    <text x="125" y="1903" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Hold in Ready Queue</text>
    <text x="125" y="1921" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Pending Recipient Arrival</text>
  </g>

  <!-- Branch CONFIRM: Release Confirmed (Down) -->
  <line x1="500" y1="1985" x2="500" y2="2045" stroke="#047857" stroke-width="3" marker-end="url(#arrow-green)" />
  <rect x="510" y="2000" width="60" height="22" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" />
  <text x="540" y="2016" text-anchor="middle" font-size="12" font-weight="800" fill="#047857">Confirm</text>

  <!-- ================= 13. EXECUTE ATOMIC RELEASE (RECTANGLE) ================= -->
  <g filter="url(#shadow)">
    <rect x="300" y="2050" width="400" height="85" rx="8" fill="url(#grad-process)" stroke="#c2410c" stroke-width="2.5" />
    <text x="500" y="2080" text-anchor="middle" font-size="15" font-weight="700" fill="#431407">Atomic Disbursement &amp; Fund Deduction</text>
    <text x="500" y="2102" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12">Deduct funds.current_balance &amp; Increment funds.total_released</text>
    <text x="500" y="2120" text-anchor="middle" font-size="12" font-weight="600" fill="#7c2d12">Update requests.status = 'Released' &amp; release_status = 'Released'</text>
  </g>

  <!-- Line: Execute Release -> Ledger & Payout -->
  <line x1="500" y1="2135" x2="500" y2="2190" stroke="#b45309" stroke-width="3" marker-end="url(#arrow)" />

  <!-- ================= 14. RECORD PAYOUT & LEDGER (RECTANGLE) ================= -->
  <g filter="url(#shadow)">
    <rect x="300" y="2195" width="400" height="80" rx="8" fill="url(#grad-process)" stroke="#c2410c" stroke-width="2.5" />
    <text x="500" y="2225" text-anchor="middle" font-size="15" font-weight="700" fill="#431407">Record Payout, Ledger &amp; Audit Log</text>
    <text x="500" y="2247" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12">Insert payouts, fund_transactions &amp; TREASURY_CONFIRM_RELEASE</text>
    <text x="500" y="2264" text-anchor="middle" font-size="12" font-weight="600" fill="#7c2d12">in system_logs &amp; Dispatch Real-Time Notifications</text>
  </g>

  <!-- Line: Record Payout -> Stop -->
  <line x1="500" y1="2275" x2="500" y2="2310" stroke="#b45309" stroke-width="3" marker-end="url(#arrow)" />

  <!-- ================= 15. STOP (OVAL) ================= -->
  <g filter="url(#shadow)">
    <ellipse cx="500" cy="2340" rx="95" ry="30" fill="url(#grad-terminator)" stroke="#c2410c" stroke-width="2.5" />
    <text x="500" y="2347" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="1">STOP</text>
  </g>

  <!-- ================= FOOTER / LEGEND ================= -->
  <g transform="translate(100, 2400)">
    <rect x="0" y="0" width="800" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    <!-- Oval Legend -->
    <ellipse cx="40" cy="25" rx="20" ry="10" fill="url(#grad-terminator)" stroke="#c2410c" stroke-width="1" />
    <text x="70" y="29" font-size="12" font-weight="700" fill="#475569">Start / Stop</text>
    <!-- Parallelogram Legend -->
    <polygon points="170,16 230,16 215,34 155,34" fill="url(#grad-io)" stroke="#c2410c" stroke-width="1" />
    <text x="240" y="29" font-size="12" font-weight="700" fill="#475569">Input / Output</text>
    <!-- Rectangle Legend -->
    <rect x="360" y="16" width="50" height="18" rx="3" fill="url(#grad-process)" stroke="#c2410c" stroke-width="1" />
    <text x="420" y="29" font-size="12" font-weight="700" fill="#475569">Process Task</text>
    <!-- Diamond Legend -->
    <polygon points="540,16 560,25 540,34 520,25" fill="url(#grad-decision)" stroke="#c2410c" stroke-width="1" />
    <text x="570" y="29" font-size="12" font-weight="700" fill="#475569">Decision Branch</text>
    <!-- Flow Arrow -->
    <line x1="700" y1="25" x2="735" y2="25" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)" />
    <text x="745" y="29" font-size="12" font-weight="700" fill="#475569">Flow Direction</text>
  </g>
</svg>
